[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-heat-xai"
version = "1.0.0"
description = "Explainable AI (SHAP) module for Urban Heat Island decision support"
authors = [{ name = "Mohit Rajurkar" }]
dependencies = [
    "shap>=0.45.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "scikit-learn>=1.4.0"
]
readme = "README.md"
requires-python = ">=3.10"
