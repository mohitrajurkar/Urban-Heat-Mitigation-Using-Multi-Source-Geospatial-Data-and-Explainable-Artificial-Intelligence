name: urban-heat

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: uhm-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urban_heat}
      POSTGRES_USER: ${POSTGRES_USER:-urbanheat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbanheat_dev_pw}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  ai-service:
    build:
      context: ./ai-service
    image: urban-heat/ai-service:1.0.0
    container_name: uhm-ai-service
    restart: unless-stopped
    environment:
      UHM_DATA_DIR: /data
      UHM_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
    ports:
      - "${AI_PORT:-8001}:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 40s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: urban-heat/backend:1.0.0
    container_name: uhm-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-urban_heat}?reWriteBatchedInserts=true
      DB_USERNAME: ${POSTGRES_USER:-urbanheat}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-urbanheat_dev_pw}
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-change-me-local-demo-secret-key-at-least-32-bytes-long-0123456789}
      DEMO_AUTO_SEED: ${DEMO_AUTO_SEED:-true}
      CORS_ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://localhost:5173
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1024m
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    image: urban-heat/frontend:1.0.0
    container_name: uhm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
