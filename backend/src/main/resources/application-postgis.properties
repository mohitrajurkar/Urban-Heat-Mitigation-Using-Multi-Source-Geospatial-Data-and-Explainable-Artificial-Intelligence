# ===================================================================
# PostGIS Production Profile Configuration
# Activate via: java -jar app.jar --spring.profiles.active=postgis
# Or in IDE run configuration: -Dspring.profiles.active=postgis
# ===================================================================

spring.application.name=urban-heat-ai
server.port=8080

# PostgreSQL + PostGIS Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/heat_ai_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate PostGIS Spatial Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Python AI Microservice Integration
ai.service.url=http://localhost:8000
ai.service.enabled=true
