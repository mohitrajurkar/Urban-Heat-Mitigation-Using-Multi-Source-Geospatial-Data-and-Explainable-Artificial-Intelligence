spring.application.name=urban-heat-ai
server.port=8080

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.name=UrbanHeatAi
app.version=1.0
app.description=Urban Heat Mitigation Decision Support System

spring.datasource.url=jdbc:h2:mem:urban_heat;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Python AI Microservice (ai-service) Integration
ai.service.url=http://localhost:8000
ai.service.enabled=true